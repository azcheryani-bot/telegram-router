name: Telegram Router Bot

on:
  schedule:
    - cron: '58 */5 * * *'
  workflow_dispatch:

concurrency:
  group: run-telegram-router
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Run Telegram Router Bot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CONTROL_BOT_TOKEN: ${{ secrets.CONTROL_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          BALE_TOKEN_ROUTER: ${{ secrets.BALE_TOKEN_ROUTER }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          GEMINI_API_KEY_ROUTER: ${{ secrets.GEMINI_API_KEY_ROUTER }}
          ROUTER_DATABASE_URL: ${{ secrets.ROUTER_DATABASE_URL }}
        run: |
          exec python telegram_router.py
